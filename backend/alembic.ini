# ============================================================
# Wodoga Platform — Alembic Configuration
# ============================================================
# This is the entry point for database migrations. It is read by the
# `alembic` CLI when run from the backend/ directory.
#
# Design choices for this project:
#   - Migrations live in backend/alembic/versions/
#   - Database URL is NOT stored here; env.py reads it from
#     app.config (single source of truth) and from a dedicated
#     ALEMBIC_DATABASE_URL env var that holds owner credentials
#     (because the runtime `wodoga_app` role intentionally cannot
#     run DDL).
#   - Autogenerate is NOT used. All migrations are hand-written SQL.
#   - File naming uses ISO date prefix for chronological ordering.
# ============================================================

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template used to generate migration files.
# Format: 2026_06_24_1430-abc123_human_label.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Search path for the SQLAlchemy URL.
# We leave sqlalchemy.url empty here; env.py constructs it at runtime
# from get_settings() / ALEMBIC_DATABASE_URL. This keeps secrets out of
# version control.
sqlalchemy.url =

# Timezone for migration timestamps (UTC, always — clinical audit hygiene)
timezone = UTC

# Truncate slug in filename
truncate_slug_length = 40

# Set to 'true' to allow running migrations under .pyc compilation
sourceless = false

# Version path separator
version_path_separator = os

# Output encoding for migration files
output_encoding = utf-8

# ============================================================
# Logging configuration
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
